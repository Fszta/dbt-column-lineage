name: Release

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Conventional Changelog Action
        id: changelog
        uses: TriPSs/conventional-changelog-action@v5
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version-file: './pyproject.toml'
          version-path: 'project.version'
          skip-changelog: 'false'
          skip-version-file: 'false'
          skip-commit: 'false'
          git-message: 'chore(release): {version}'
          git-user-name: 'Fszta'
          fallback-version: '0.1.1'
          preset: 'conventionalcommits'
          release-count: '0'

      - name: Create Release
        if: steps.changelog.outputs.skipped != 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.changelog.outputs.version }}
          name: Release v${{ steps.changelog.outputs.version }}
          body: ${{ steps.changelog.outputs.clean_changelog }}
          draft: false
          prerelease: false

      # Move the floating major tag (e.g. v0) to this release so consumers of the
      # GitHub Action can pin `uses: Fszta/dbt-column-lineage@v0` and get updates
      # within the major — the standard action-versioning convention.
      - name: Update floating major tag
        if: steps.changelog.outputs.skipped != 'true'
        env:
          VERSION: ${{ steps.changelog.outputs.version }}
        run: |
          MAJOR="v${VERSION%%.*}"
          git tag -f "$MAJOR" "v${VERSION}"
          git push origin -f "refs/tags/$MAJOR"

      - name: Setup Python
        if: steps.changelog.outputs.skipped != 'true'
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Build and verify documentation
        if: steps.changelog.outputs.skipped != 'true'
        run: |
          pip install mkdocs-material mkdocs-click
          mkdocs build

      - name: Trigger publish workflow
        if: steps.changelog.outputs.skipped != 'true'
        uses: peter-evans/repository-dispatch@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          event-type: trigger-publish

      - name: Trigger docs deployment
        if: steps.changelog.outputs.skipped != 'true'
        uses: peter-evans/repository-dispatch@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          event-type: trigger-docs

      # Deploy the live interactive-explorer demo (scripts/render_start.py) hosted
      # on Render. Uses a Deploy Hook URL stored as a secret so releases stay in
      # sync automatically instead of a manual "Deploy" click in the dashboard.
      # No-ops (with a note) if the secret isn't configured — secrets can't be
      # referenced directly in `if:`, so gate on an env var instead.
      - name: Deploy demo to Render
        if: steps.changelog.outputs.skipped != 'true'
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL not set — skipping Render demo deploy."
            exit 0
          fi
          curl -fsSL -X POST "$RENDER_DEPLOY_HOOK_URL"

name: Release

# Manual, deterministic release. The version is decided by the `version_bump`
# input (or `custom_version`) via `poetry version` — NOT inferred from commit
# messages — so a `BREAKING CHANGE` footer no longer silently forces a 1.0.0
# major bump. The changelog is generated from the commits since the last tag by
# .github/scripts/gen_changelog.py.
on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Semver bump to apply (ignored when custom_version is set)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      custom_version:
        description: 'Explicit version, e.g. 0.14.1 (overrides version_bump)'
        required: false
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          # Pin Poetry: matches test.yml; "latest" has failed to install on runners.
          version: 2.1.3

      - name: Configure git
        run: |
          git config user.name 'Fszta'
          git config user.email 'Fszta@users.noreply.github.com'

      - name: Determine version
        id: version
        run: |
          set -euo pipefail
          # Match ONLY vX.Y.Z release tags. The floating major tag (v0, v1, …)
          # is a lightweight tag that sits on the same commit as the last release
          # tag; with a bare 'v*' match, `git describe --abbrev=0` picks it up and
          # emits the LONG form (v0.14.0-27-g<sha>) instead of the bare tag. That
          # string resolves back to HEAD, making `prev..HEAD` empty and producing
          # an empty changelog (see the empty v0.15.0 release). The two-dot glob
          # excludes v0/v1 and keeps the closest real release tag.
          PREV_TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || echo "")
          if [ -n "${{ inputs.custom_version }}" ]; then
            poetry version "${{ inputs.custom_version }}"
          else
            poetry version "${{ inputs.version_bump }}"
          fi
          NEW=$(poetry version --short)
          echo "version=$NEW" >> "$GITHUB_OUTPUT"
          echo "prev_tag=$PREV_TAG" >> "$GITHUB_OUTPUT"
          echo "Releasing v$NEW (previous tag: ${PREV_TAG:-none})"

      - name: Guard against re-releasing an existing version
        run: |
          if git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "::error::Tag v${{ steps.version.outputs.version }} already exists — pick a different bump."
            exit 1
          fi

      - name: Generate changelog + release notes
        run: |
          set -euo pipefail
          NEW="${{ steps.version.outputs.version }}"
          PREV="${{ steps.version.outputs.prev_tag }}"
          python3 .github/scripts/gen_changelog.py "$NEW" "$PREV" > RELEASE_NOTES.md
          echo "----- release notes -----"
          cat RELEASE_NOTES.md
          # Prepend the new section to CHANGELOG.md (RELEASE_NOTES.md is left
          # untracked for softprops/body_path and is not committed).
          touch CHANGELOG.md
          { cat RELEASE_NOTES.md; echo; cat CHANGELOG.md; } > CHANGELOG.tmp
          mv CHANGELOG.tmp CHANGELOG.md

      - name: Commit and tag
        run: |
          set -euo pipefail
          NEW="${{ steps.version.outputs.version }}"
          git add pyproject.toml CHANGELOG.md
          git commit -m "chore(release): v$NEW [skip ci]"
          git tag -a "v$NEW" -m "Release v$NEW"
          git push origin "HEAD:${{ github.ref_name }}"
          git push origin "v$NEW"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false

      # Move the floating major tag (e.g. v0) to this release so consumers of the
      # GitHub Action can pin `uses: Fszta/dbt-column-lineage@v0` and get updates
      # within the major — the standard action-versioning convention.
      - name: Update floating major tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          MAJOR="v${VERSION%%.*}"
          git tag -f "$MAJOR" "v${VERSION}"
          git push origin -f "refs/tags/$MAJOR"

      - name: Build and verify documentation
        run: |
          pip install mkdocs-material mkdocs-click
          mkdocs build

      # The GitHub Release above is created by GITHUB_TOKEN, which by design does
      # NOT trigger other workflows' `release` events — so publish/docs are kicked
      # explicitly via repository_dispatch.
      - name: Trigger publish workflow
        uses: peter-evans/repository-dispatch@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          event-type: trigger-publish

      - name: Trigger docs deployment
        uses: peter-evans/repository-dispatch@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          event-type: trigger-docs

      # Deploy the live interactive-explorer demo (scripts/render_start.py) hosted
      # on Render. Uses a Deploy Hook URL stored as a secret so releases stay in
      # sync automatically instead of a manual "Deploy" click in the dashboard.
      # No-ops (with a note) if the secret isn't configured — secrets can't be
      # referenced directly in `if:`, so gate on an env var instead.
      - name: Deploy demo to Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL not set — skipping Render demo deploy."
            exit 0
          fi
          curl -fsSL -X POST "$RENDER_DEPLOY_HOOK_URL"

name: "Parrant"
description: >-
  Post a column-level blast-radius report as a sticky PR comment and optionally
  gate the check on impact severity.
author: "Fszta"
branding:
  icon: "git-branch"
  color: "purple"

inputs:
  manifest:
    description: "Path to the head (current) dbt manifest.json"
    default: "target/manifest.json"
  catalog:
    description: "Path to the head (current) dbt catalog.json"
    default: "target/catalog.json"
  base-manifest:
    description: "Path to the base (target-branch) manifest.json for the reliable two-manifest diff"
    required: false
    default: ""
  base-catalog:
    description: "Path to the base (target-branch) catalog.json (defaults to catalog.json next to base-manifest)"
    required: false
    default: ""
  git-base:
    description: "Fallback: git ref to diff changed .sql files against when no base manifest is available (e.g. origin/main)"
    required: false
    default: ""
  scope-git:
    description: "With a two-manifest diff, restrict the report to models changed in `git diff <ref>...HEAD` (e.g. origin/main)"
    required: false
    default: ""
  fail-on:
    description: >-
      Severity gate: none | tests | exposures | critical | any | policy (default 'none' =
      warn only, never block). 'tests' fails only on a provable break (a dbt test the change
      orphans) — the safe level to block on; requires base-manifest. 'policy' fails when the
      metadata-agnostic policy engine returns a BLOCK verdict; requires 'policy'.
    default: "none"
  policy:
    description: >-
      Path to a policy.yml for the metadata-agnostic policy engine. When set (or a
      ./parrant.policy.yml exists), the report gains a 'policy_verdict' block and
      'fail-on: policy' gates on it. A present-but-invalid file fails the run loudly.
    required: false
    default: ""
  adapter:
    description: "Override the sqlglot dialect (e.g. snowflake, bigquery, tsql)"
    required: false
    default: ""
  no-overrides:
    description: >-
      Ignore `-- lineage:allow-change` / `-- lineage:allow-break` override pragmas and compute
      the RAW gate as if none were present (set 'true' for the backtest / override-reliance
      audit). Default 'false' honors the pragmas.
    required: false
    default: "false"
  github-token:
    description: "Token used to post the sticky PR comment (needs pull-requests: write)"
    default: ${{ github.token }}
  python-version:
    description: "Python version used to run the tool"
    default: "3.11"
  version:
    description: >-
      Override how parrant is installed. Empty (default) installs the
      source bundled with this action ref, so the tool always matches the tag you
      pin (e.g. @v0.8.0 runs the 0.8.0 code). Set to a PyPI version spec
      (e.g. "0.8.0") to install from PyPI instead.
    required: false
    default: ""

outputs:
  affected_models:
    description: "Number of downstream models whose output is affected by the change."
    value: ${{ steps.impact.outputs.affected_models }}
  affected_columns:
    description: "Number of downstream columns affected by the change."
    value: ${{ steps.impact.outputs.affected_columns }}
  affected_exposures:
    description: "Number of business-facing exposures (dashboards/apps) affected."
    value: ${{ steps.impact.outputs.affected_exposures }}
  provable_breaks:
    description: >-
      Number of provable breaks — dbt tests the change orphans that will fail on the next
      `dbt build`. The block-worthy signal behind `fail-on: tests`.
    value: ${{ steps.impact.outputs.provable_breaks }}
  verdict:
    description: "Overall ruling for the change: safe | review | block."
    value: ${{ steps.impact.outputs.verdict }}
  tripped_level:
    description: >-
      Highest impact severity the change reaches, in gate terms:
      tests | exposures | critical | any | none.
    value: ${{ steps.impact.outputs.tripped_level }}
  policy_decision:
    description: >-
      Policy-engine gate decision: block | warn | allow (empty when no policy ran).
    value: ${{ steps.impact.outputs.policy_decision }}
  build_set_size:
    description: "Number of models in the policy engine's selective build set."
    value: ${{ steps.impact.outputs.build_set_size }}
  test_set_size:
    description: "Number of models in the policy engine's selective test set."
    value: ${{ steps.impact.outputs.test_set_size }}
  overrides_applied:
    description: >-
      Number of honored override pragmas (allow-change / allow-break) that lowered a
      contribution on this change. 0 when none.
    value: ${{ steps.impact.outputs.overrides_applied }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
        # Cache pip downloads keyed on this action's own dependency spec so repeat
        # runs skip re-downloading the tool's dependencies.
        cache: pip
        cache-dependency-path: ${{ github.action_path }}/pyproject.toml

    - name: Install parrant
      shell: bash
      run: |
        if [ -n "${{ inputs.version }}" ]; then
          pip install "parrant==${{ inputs.version }}"
        else
          # $GITHUB_ACTION_PATH is this repo checked out at the pinned ref, so
          # installing it means the CLI always matches the tag the caller pinned.
          pip install "$GITHUB_ACTION_PATH"
        fi

    - name: Run column-level impact assessment
      id: impact
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        args=(impact --ci
          --manifest "${{ inputs.manifest }}"
          --catalog "${{ inputs.catalog }}"
          --fail-on "${{ inputs.fail-on }}")
        [ -n "${{ inputs.base-manifest }}" ] && args+=(--base-manifest "${{ inputs.base-manifest }}")
        [ -n "${{ inputs.base-catalog }}" ] && args+=(--base-catalog "${{ inputs.base-catalog }}")
        [ -n "${{ inputs.git-base }}" ] && args+=(--git-base "${{ inputs.git-base }}")
        [ -n "${{ inputs.scope-git }}" ] && args+=(--scope-git "${{ inputs.scope-git }}")
        [ -n "${{ inputs.adapter }}" ] && args+=(--adapter "${{ inputs.adapter }}")
        [ -n "${{ inputs.policy }}" ] && args+=(--policy "${{ inputs.policy }}")
        [ "${{ inputs.no-overrides }}" = "true" ] && args+=(--no-overrides)
        parrant "${args[@]}"

site_name: Parrant
site_description: Impact analysis for dbt projects using column-level data lineage
site_url: https://fszta.github.io/parrant/
repo_url: https://github.com/Fszta/parrant
repo_name: Fszta/parrant
site_author: Fszta

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Fszta/parrant
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/parrant/
  generator: false

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  # Fonts are driven from stylesheets/custom.css (DM Sans / Fraunces / JetBrains Mono)
  # to match the interactive explorer's design system.
  font: false
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.expand
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.integrate
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/custom.css

plugins:
  - search:
      lang: en

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        # Render ```mermaid fences as diagrams. Material bundles Mermaid.js locally and
        # auto-themes it to the indigo palette in light + dark (no external CDN).
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quickstart.md
  - Features:
    - Impact Analysis: features/impact-analysis.md
  - Decision Engine:
    - Overview: decision-engine/overview.md
    - Concepts:
      - How it works: decision-engine/concepts/how-it-works.md
      - Guardrails & non-goals: decision-engine/concepts/guardrails.md
      - Things to know: decision-engine/concepts/gotchas.md
    - Guides:
      - Semantic Categorization: decision-engine/semantic-categorization.md
      - Policy Gate: decision-engine/policy-gate.md
      - Policy Recipes: decision-engine/policy-recipes.md
      - Cross-boundary (Metabase): decision-engine/metabase.md
      - Explorer: decision-engine/explorer.md
    - Glossary: decision-engine/glossary.md
  - Reference:
    - JSON Output: reference/json-output.md
  - Roadmap: ROADMAP.md
  - Changelog: changelog.md
